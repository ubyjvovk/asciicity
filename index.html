<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Walk London and Kyiv rendered as coloured ASCII — 13 render styles, fly mode, postcards." />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="AsciiCity" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ubyjvovk.github.io/asciicity/" />
    <meta property="og:image" content="https://ubyjvovk.github.io/asciicity/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:description" content="Walk London and Kyiv rendered as coloured ASCII — 13 render styles, fly mode, postcards." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ubyjvovk.github.io/asciicity/og.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AsciiCity</title>
    <!-- Boot #busy line (T-0174, docs/hud-busy.md): inline so it paints before
         the bundle loads style.css (dev injects it from JS). -->
    <style>
      #busy.boot {
        position: fixed;
        left: 0;
        bottom: 0;
        height: 20px;
        line-height: 20px;
        padding: 0 8px;
        box-sizing: border-box;
        background: #000;
        color: #48e06a;
        font-family: monospace;
        font-size: 11px;
        white-space: nowrap;
        pointer-events: none;
        z-index: 11;
        opacity: 0;
      }
      #busy.boot.on {
        opacity: 1;
      }
      #busy.boot.neon {
        color: #ff3ad8;
        text-shadow: 0 0 6px currentColor;
      }
      #busy.boot.neon .busy-bar {
        color: #3ef2ff;
      }
      #busy.boot .busy-bar {
        animation: busy-boot-pulse 0.9s ease-in-out infinite alternate;
      }
      @keyframes busy-boot-pulse {
        from { opacity: 0.35; }
        to { opacity: 1; }
      }
      @media (max-width: 599px) {
        #busy.boot .busy-label {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <button type="button" id="gear" aria-label="Settings">⚙</button>
    <div id="overlay">
      <h1>ASCIICITY</h1>
      <p>CLICK TO ENTER</p>
      <div id="menu"></div>
    </div>
    <div id="busy" class="on boot" aria-hidden="true"><span class="busy-head">⠋ JACK-IN </span><span class="busy-bar">▱▱▱▱▱▱▱▱</span><span class="busy-label"> LINKING NODE</span></div>
    <script type="module" src="/src/main.ts"></script>

</html>
